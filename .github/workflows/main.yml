# BULWARK — primary CI/CD (Phase-3 infra bring-up, §12 CI/CD canon).
# Compile on every push → run tests → produce an Android build → publish artifacts, compile
# logs, and test results. Uses game-ci (https://game.ci). Supersedes the Phase-0 ci.yml.
#
# Secrets (provisioned by the owner in this repo's GitHub Secrets):
#   UNITY_LICENSE (preferred personal-license .ulf) OR UNITY_EMAIL + UNITY_PASSWORD (+ serial),
#   PLAYFAB_SECRET_KEY (server-side/integration steps; the Unity build itself does not need it).
#
# NOTE: the PlayFab adapters are behind the PLAYFAB_SDK define-constrained asmdef and are EXCLUDED
# from this build (no SDK installed) — they cannot affect compilation here. This pipeline validates
# the Phase 0–3 codebase compiling + building; PlayFab live validation is a separate integration step.

name: main

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# game-ci's test-runner publishes a check-run with results; that needs checks:write.
permissions:
  contents: read
  checks: write

jobs:
  test:
    name: EditMode + PlayMode tests (compile validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: all
          artifactsPath: test-results
          # githubToken omitted: results are published via the test-results artifact; passing
          # GITHUB_TOKEN here makes the action create a check-run, which fails with "Resource
          # not accessible by integration" unless checks:write is granted (now granted above).
          # Omitting it keeps the step green regardless of repo token-permission defaults.
      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: test-results }
      - name: Publish test logs
        uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-logs, path: "**/*.log", if-no-files-found: ignore }

  build:
    name: Android build
    runs-on: ubuntu-latest
    # Independent of `test` so build/compile logs are produced even if tests fail (more evidence).
    steps:
      # The Unity Android editor image (~10GB) exhausts the default runner disk during pull
      # (docker exit 125). Reclaim ~25GB of preinstalled tooling first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-builder@v4
        id: builder
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          buildName: BULWARK
      - name: Publish Android build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-build, path: build, if-no-files-found: warn }
      - name: Publish build logs
        uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-logs, path: "**/*.log", if-no-files-found: ignore }
